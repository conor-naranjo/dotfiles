# start a terminal
bindsym $mod+Return exec alacritty

# Launches various programs
# bindsym $mod+g exec chromium
bindsym $mod+Shift+f exec firefox
bindsym $mod+Shift+s exec spotify-launcher

# start dmenu (a program launcher)
# bindsym $mod+d exec dmenu_run

# There also is the (new) i3-dmenu-desktop which only displays applications
# shipping a .desktop file. It is a wrapper around dmenu, so you need that
# installed.
bindsym $mod+d exec --no-startup-id i3-dmenu-desktop --dmenu="dmenu -i -fn 'Hack-10' -nb '#0b0b0a' -nf '#c8c4bc' -sb '#99292d' -sf '#e6e2da'"

# Display clipboard
bindsym $mod+Shift+d exec --no-startup-id clipmenu -i -fn 'Hack-10' -nb '#0b0b0a' -nf '#c8c4bc' -sb '#99292d' -sf '#e6e2da'

# Binds Win + Alt + 4 to take a screenshot and save the file
bindsym $mod+$alt+4 exec "maim -s ~/Pictures/screenshots/$(date +%Y)/$(date +%m.%d.%s | tr A-Z a-z).png
# Binds Win + Alt + S to take a screenshot and save to clipboard
bindsym $alt+$mod+s exec "maim -s | xclip -selection clipboard -t image/png"

# TODO: figure out how to make this command dynamically only capture the
# currently active monitor and not a full capture of all screens
bindsym $alt+$mod+5 exec "maim ~/Pictures/screenshots/$(date +%Y)/$(date +%m.%d.%s | tr A-Z a-z).png
