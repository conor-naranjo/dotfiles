# Start i3bar to display a workspace bar (plus the system information i3status
# finds out, if available)
bar {
        status_command $HOME/bin/conky-i3bar
        #status_command i3status
        
        # Places the i3bar on top of screen
        position top

        # Chooses the font for the bar to use
        font pango:Hack 10

        separator_symbol "│"
        
    #Sets the colors for i3bar
    colors {
        background         #0b0b0a
        statusline         #c8c4bc
        separator          #383532
        focused_workspace  #99292d #6e1d20 #e6e2da
        active_workspace   #293f66 #182238 #c8c4bc
        inactive_workspace #1a1918 #0b0b0a #78746e
        urgent_workspace   #cc3e3e #801818 #e6e2da
    }
}

# Colors: 
# <colorclass>           <border>    <bg>        <txt>       <indicator>   <child_border>
client.focused           #99292d     #0b0b0a     #e6e2da     #c8c4bc       #99292d
client.focused_inactive  #293f66     #0b0b0a     #9e9a92     #293f66       #293f66
client.unfocused         #182238     #0b0b0a     #78746e     #182238       #182238
client.urgent            #cc3e3e     #801818     #e6e2da     #cc3e3e       #cc3e3e

# Font for window titles. Will also be used by the bar unless a different font
# is used in the bar {} block below.
font pango:Hack 11px
