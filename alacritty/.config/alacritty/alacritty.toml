white   = "#c8c4bc"

[colors.bright]
black   = "#57534e"
red     = "#cc3e3e"
green   = "#3fb950"
yellow  = "#dfb454"
blue    = "#527294"
magenta = "#ad85bf"
cyan    = "#62aba7"
white   = "#e6e2da"
