[window]
dynamic_title = true

[window.dimensions]
columns = 0
lines = 0

[scrolling]
history = 500

[font.normal]
family = "Hack"
style = "Regular"

[font.bold]
family = "Hack"
style = "Bold"

[font.italic]
family = "Hack"
style = "Italic"

[font.bold_italic]
